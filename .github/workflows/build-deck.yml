name: Build deck

on:
  schedule:
    # ONE entry instead of ~130 hand-paired DST crons.
    #
    # Fires every 10 minutes, 10:00-22:59 UTC, Mon-Fri. That window covers
    # 6:00 AM - 6:59 PM ET during EDT and 5:00 AM - 5:59 PM ET during EST, so
    # the schedule never needs touching when the clocks change.
    #
    # The `window` job below decides whether a run should actually build:
    # it builds only between 05:30 and 18:00 America/New_York. Runs outside
    # that window finish in a few seconds instead of ~2 minutes.
    - cron: '*/10 10-22 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decides whether this run falls inside shop hours (America/New_York).
  # workflow_dispatch always builds, so a manual run is never gated.
  window:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run - building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOW=$((10#$(TZ=America/New_York date +%H%M)))   # 0530 -> 530, base-10 safe
          DOW=$(TZ=America/New_York date +%u)   # 1=Mon .. 7=Sun
          echo "America/New_York time: $NOW (day $DOW)"
          if [ "$DOW" -ge 6 ]; then
            echo "Weekend - skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$NOW" -ge 530 ] && [ "$NOW" -le 1800 ]; then
            echo "Inside 05:30-18:00 ET - building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside 05:30-18:00 ET - skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: window
    if: needs.window.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build shop deck (HTML + PPTX)
        env:
          HCP_API_KEY: ${{ secrets.HCP_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build-deck
      - name: Build office display HTML
        env:
          HCP_API_KEY: ${{ secrets.HCP_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
        run: npm run build-office
      - name: Prepare Pages site directory
        run: |
          mkdir -p pages-site
          cp output/GoldenRule_ShopBriefing_CURRENT.html pages-site/index.html
          cp output/GoldenRule_ShopBriefing_CURRENT.html pages-site/shop-briefing.html
          cp output/GoldenRule_OfficeDisplay_CURRENT.html pages-site/office.html
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
